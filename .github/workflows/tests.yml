name: CPU validation
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r experiments/hodge_diagnostics/requirements.txt
      - run: python -m compileall -q scripts experiments tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/cyclic_history -p 'test_*.py' -v
      - run: python -m pytest -q experiments/hodge_diagnostics
      - name: Check shell syntax
        run: |
          bash -n slurm/cyclic_history_calibrated.sh
          bash -n slurm/oracle.sh
          bash -n slurm/nonoracle.sh
          bash -n slurm/cyclic_history.sh
